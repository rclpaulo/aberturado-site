<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bem-vindo Cmte Paulo Leite</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(to top, #87ceeb, #b0e0e6);
      font-family: sans-serif;
    }

    .intro {
      position: relative;
      width: 100%;
      height: 100vh;
    }

    .tugboat {
      position: absolute;
      top: 50vh;
      right: -50vw;
      width: 20vw;
      animation: sail 9s linear forwards;
      z-index: 2;
    }

    .text {
      position: absolute;
      top: 85vh;
      right: -25vw;
      font-size: 2.5vw;
      font-weight: bold;
      color: #333;
      animation: sailText 13s linear forwards;
      z-index: 2;
    }

    @keyframes sail {
      0% { right: -50vw; }
      100% { right: 100vw; }
    }

    @keyframes sailText {
      0% { right: -25vw; }
      100% { right: 100vw; }
    }

    .main-content {
      display: none;
      padding: 5vw;
      text-align: center;
    }

    .towline {
      position: absolute;
      top: 90vh;
      right: -35vw;
      width: 22vw;
      height: 0.3vh;
      background-color: #555;
      animation: towMove 11s linear forwards;
      z-index: 2;
    }

    @keyframes towMove {
      0% { right: -35vw; }
      100% { right: 100vw; }
    }

    .sea {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 20vh;
      background: linear-gradient(to top, #1e90ff 60%, #00bfff 100%);
      overflow: hidden;
      z-index: 1;
    }

    .sea::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 100%;
      background: radial-gradient(circle at 50% 100%, #ffffff44 20%, transparent 21%) repeat-x;
      background-size: 5vw 100%;
      animation: wave 4s linear infinite;
      opacity: 0.4;
    }

    @keyframes wave {
      0% { transform: translateX(0); }
      100% { transform: translateX(-1%); }
    }

    .bigship {
      position: absolute;
      bottom: -38vh;
      left: 10%;
      width: 60vw;
      z-index: 0;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="intro">
    <audio id="motor" autoplay>
      <source src="imagem/motor.mp3" type="audio/mpeg">
    </audio>
    <audio id="ondas" autoplay loop>
      <source src="imagem/mar-agitado-272999.mp3" type="audio/mpeg">
    </audio>
    <audio id="buzina">
      <source src="imagem/b1.mp3" type="audio/mpeg">
    </audio>

    <img src="imagem/baixados.png" alt="Navio grande parado" class="bigship">
    <img src="imagem/opala2.jpg.png" alt="Rebocador navegando" class="tugboat">
    <div class="towline"></div>
    <div class="text">Cmte Paulo Leite</div>
    <div class="sea"></div>
  </div>

  <div class="main-content" id="main">
    <h1>Bem-vindo ao site do Cmte Paulo Leite</h1>
    <p>Conteúdo principal aqui...</p>
  </div>

  <script>
    setTimeout(() => {
      document.getElementById('buzina').play();
    }, 1000);

    setTimeout(() => {
      document.querySelector('.intro').style.display = 'none';
      document.getElementById('main').style.display = 'block';
      document.getElementById('motor').pause();
      document.getElementById('ondas').pause();
      document.getElementById('buzina').pause();
    }, 8500);
  </script>
</body>
</html>
