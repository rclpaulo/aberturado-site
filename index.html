<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bem-vindo Cmte Paulo Leite</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(to top, #87ceeb, #b0e0e6);
      font-family: sans-serif;
    }

    .intro {
      position: relative;
      width: 100%;
      height: 100vh;
    }

    .tugboat {
      position: absolute;
      top: 30%;
      right: -600px;
      width: 300px;
      animation: sail 9s linear forwards;
      z-index: 2;
    }

    .text {
      position: absolute;
      top: 70%;
      right: -300px;
      font-size: 2em;
      font-weight: bold;
      color: #333;
      animation: sailText 13s linear forwards;
    }

    @keyframes sail {
      0% { right: -600px; }
      100% { right: 100%; }
    }

    @keyframes sailText {
      0% { right: -300px; }
      100% { right: 100%; }
    }

    .main-content {
      display: none;
      padding: 2rem;
      text-align: center;
    }
    .towline {
  position: absolute;
  top: 74%;
  right: -450px;
  width: 350px;
  height: 2px;
  background-color: #555;
  animation: towMove 11s linear forwards;
}

@keyframes towMove {
  0% { right: -450px; }
  100% { right: 100%; }
}

.sea {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 200px;
  background: repeating-linear-gradient(
    -45deg,
    #1e90ff,
    #1e90ff 20px,
    #00bfff 20px,
    #00bfff 40px
  );
  animation: wave 4s linear infinite;
  z-index: 1;
}

@keyframes wave {
  0% { background-position: 0 0; }
  100% { background-position: 100px 0; }
}

.sea {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 200px;
  background: linear-gradient(to top, #1e90ff 60%, #00bfff 100%);
  overflow: hidden;
  z-index: 0;
}

.sea::before {
  content: "";
  position: absolute;
  width: 200%;
  height: 100%;
  background: radial-gradient(circle at 50% 100%, #ffffff44 20%, transparent 21%) repeat-x;
  background-size: 50px 100%;
  animation: wave 4s linear infinite;
  opacity: 0.4;
}

@keyframes wave {
  0% { transform: translateX(0); }
  100% { transform: translateX(-1%); }
}

.tugboat, .towline, .text {
  z-index: 1;
}

.bigship {
  position: absolute;
  bottom: -185px; /* altura acima da faixa de mar */
  left: 5%;
  width: 900px;
  z-index: 0;
  opacity: 0.9; /* leve transparência para dar profundidade */
  left: 10%;
}




  </style>
</head>
<body>
  <div class="intro">
    <audio id="motor" autoplay>
  <source src="" type="audio/mpeg">
</audio>
<audio id="ondas" autoplay loop>
  <source src="imagem/mar-agitado-272999.mp3" type="audio/mpeg">
</audio>
<audio id="buzina" autoplay>
  <source src="imagem/b1.mp3" type="audio/mpeg">
</audio>


    <img src="imagem/baixados.png" alt="Navio grande parado" class="bigship">
    <img src="imagem/opala2.jpg.png" alt="" class="tugboat">
    <div class="towline"></div>
    <div class="text">Cmte Paulo Leite</div>
    <div class="sea"></div>
   
  </div>

  <div class="main-content" id="main">
  
    <h1>Bem-vindo ao site do Cmte Paulo Leite</h1>
    <p>Conteúdo principal aqui...</p>
  </div>

  

  <script>
  setTimeout(() => {
    document.querySelector('.intro').style.display = 'none';
    document.getElementById('main').style.display = 'block';

    // Parar os áudios
    document.getElementById('motor').pause();
    document.getElementById('ondas').pause();
  }, 8500);
</script>
<script>
  setTimeout(() => {
    document.getElementById('buzina').play();
  }, 1000); // toca após 1 segundo
  document.getElementById('buzina').pause();
</script>
</body>
</html>
